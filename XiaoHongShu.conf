
// ==UserScript==
// @ScriptName        小红书净化+去水印[fmz200版·自用改版：保留购物链接]
// @Author            原脚本 @fmz200，改版托管 @liliggup
// @MainFunction      去除开屏/信息流/搜索广告，去除帖子图片水印、Live图水印及短视频水印，解除下载限制；购物频道、带货与商品笔记、笔记购物链接、商城入口均保留
// @UpdateTime        2026-11-21（脚本基于 fmz200 2026-06-05 版）
// @ScriptURL         https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/XiaoHongShu.conf
// ==/UserScript==

hostname = *.xiaohongshu.com

# > 搜索横幅广告
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/search\/banner_list url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 热搜列表净化
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/search\/hot_list url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 搜索默认填词净化
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/search\/hint url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 猜你想搜净化
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/search\/trending url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 搜索结果去广告
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/search\/notes\? url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 启动配置净化（保留商城）
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/system_service\/config\? url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 开屏广告
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/system_service\/splash_config url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 信息流图片去水印
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/note\/imagefeed url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 笔记详情去水印+解除下载限制
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/note\/feed\? url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > Live图去水印保存
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/note\/live_photo\/save url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 笔记页组件净化（保留购物组件）
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/note\/widgets url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 视频流去水印+解除下载限制
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/note\/videofeed url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 视频保存（无水印地址替换）
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/note\/video\/save url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 首页信息流去广告（保留带货/商品笔记）
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/homefeed url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 关注页信息流净化
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/user\/followings\/followfeed url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/followfeed url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 关注推荐净化
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/recommend\/user\/follow_recommend url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 评论区图片去水印
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/note\/comment\/list\? url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/note\/comment\/sub_comments\? url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js
# > 评论视频下载
^https?:\/\/[a-z]+\.xiaohongshu\.com\/api\/sns\/v\d+\/interaction\/comment\/video\/download\? url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/redbook_keep_shop.js

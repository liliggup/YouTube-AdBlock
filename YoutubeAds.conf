########################################
# 应用名称： Youtube Block AD（自用改版：保留上传按钮）
# 原作者： @DivineEngine, @app2smile, @Maasea, @VirgilClyne
# 原始出处： ddgksf2013/Rewrite - AdBlock/YoutubeAds.conf（2025-03-09）
# 唯一改动：脚本默认参数 blockUpload 改为 false，不再删除
# YouTube 底部中间的“上传/创建（+）”按钮；
# 去广告、视频自动PIP、后台播放、字幕自动翻译等功能全部保留。
#
# 把下面脚本地址里的三处占位符换成你自己的：
# USERNAME = 你的 GitHub 用户名
# REPO = 你的仓库名
# BRANCH = 分支名（新建仓库默认是 main，老仓库可能是 master）
# 前提：本文件和 youtube_no_upload.js 放在仓库的同一目录下
# （下面按放在仓库根目录写的；若放在子目录，地址里要带上子目录名）。
# 注意：Premium 会员不要开启；如视频广告仍在，
# 在 QuantumultX 配置 [general] 下添加 udp_drop_list=443
########################################

hostname = -redirector*.googlevideo.com,*.googlevideo.com,www.youtube.com,s.youtube.com,youtubei.googleapis.com

# ======= 视频广告请求 ======= #
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) url 302 $1$2$3
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad url reject-200

# ======= 视频PIP|后台播放|瀑布流|搜索页|播放页|短视频|贴片广告 ======= #
^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch) url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/youtube_no_upload.js

# ======= 通用广告请求 ======= #
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads url reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) url reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext url reject-200

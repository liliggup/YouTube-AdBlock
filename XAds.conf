# X (Twitter) 去广告 for QuantumultX
# 原理:过滤 X 接口返回的时间线数据,摘掉带推广标记的条目(广告/推广推文)
# 市面上暂无持续维护的圈X专用版,此为 Muse 自制版,需开启 MitM 并信任证书
# 配套脚本:x_no_ads.js(与本文件同仓库)

^https:\/\/api\.twitter\.com\/graphql\/.+ url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/x_no_ads.js
^https:\/\/api\.x\.com\/graphql\/.+ url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/x_no_ads.js
^https:\/\/x\.com\/i\/api\/graphql\/.+ url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/x_no_ads.js
^https:\/\/api\.twitter\.com\/2\/(timeline|search)\/.+ url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/x_no_ads.js

hostname = api.twitter.com, api.x.com, x.com

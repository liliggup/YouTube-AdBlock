# X (Twitter) 去广告 for QuantumultX
# 原理:过滤 X 时间线接口返回的数据,摘掉带推广标记的条目(广告/推广推文)
# 市面上暂无持续维护的圈X专用版,此为 Muse 自制版,需开启 MitM 并信任证书
# 配套脚本:x_no_ads.js(与本文件同仓库)
# v2:只处理时间线/搜索接口,不碰推文详情等接口,避免影响视频加载

^https:\/\/api\.twitter\.com\/graphql\/[^\/]+\/(HomeTimeline|HomeLatestTimeline|SearchTimeline)(\?|$) url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/x_no_ads.js
^https:\/\/api\.x\.com\/graphql\/[^\/]+\/(HomeTimeline|HomeLatestTimeline|SearchTimeline)(\?|$) url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/x_no_ads.js
^https:\/\/x\.com\/i\/api\/graphql\/[^\/]+\/(HomeTimeline|HomeLatestTimeline|SearchTimeline)(\?|$) url script-response-body https://raw.githubusercontent.com/liliggup/YouTube-AdBlock/main/x_no_ads.js

hostname = api.twitter.com, api.x.com, x.com
